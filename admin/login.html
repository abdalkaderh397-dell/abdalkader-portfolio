<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Abdalkader Portfolio</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061018;color:#f4f8fa;font-family:Cairo,Arial,sans-serif}.box{width:min(420px,calc(100% - 36px));padding:32px;background:#0c1822;border:1px solid #ffffff1a;border-radius:22px;box-shadow:0 25px 80px #0008}h1{margin-top:0;font-size:28px}p{color:#9aaab4}label{display:block;margin:15px 0 6px;font-size:13px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #ffffff18;background:#12222d;color:#fff;font:inherit}button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:#48dcff;color:#031017;font-weight:800;cursor:pointer}.error{padding:10px;border-radius:10px;background:#ff4d4d18;color:#ff9c9c;font-size:13px}.back{display:block;text-align:center;margin-top:18px;color:#48dcff;text-decoration:none}</style></head><body><div class="box"><h1>لوحة التحكم 🔐</h1><p>تسجيل دخول مدير الموقع</p><form id="loginForm"><label>اسم المستخدم</label><input id="username" required autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button>دخول</button><p id="error" class="error" hidden></p></form><a class="back" href="/">العودة للموقع</a></div><script>loginForm.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(d.success)location.href='/admin/';else{error.textContent='اسم المستخدم أو كلمة المرور غير صحيحة.';error.hidden=false}});</script></body></html>
