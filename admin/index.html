<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Dashboard</title><style>body{margin:0;background:#061018;color:#f4f8fa;font-family:Cairo,Arial,sans-serif}.wrap{width:min(1150px,calc(100% - 30px));margin:35px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top a,.top button{color:#48dcff;text-decoration:none;background:none;border:0;cursor:pointer;font:inherit}.notice{display:none;margin:0 0 18px;padding:13px 16px;border:1px solid #48dcff66;border-radius:12px;background:#48dcff18;color:#48dcff}.notice.show{display:block}.enable{margin-top:12px;padding:8px 12px;border:1px solid #48dcff66;border-radius:9px;background:#12222d;color:#48dcff;cursor:pointer;font:inherit}.grid{display:grid;gap:14px}.item{background:#0c1822;border:1px solid #ffffff17;border-radius:18px;padding:20px}.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:#9aaab4;font-size:12px}.rating{font-size:34px}.message{margin:15px 0;line-height:1.9;white-space:pre-wrap}.pill{padding:4px 9px;border-radius:20px;background:#12222d}.delete{border:0;background:#481d24;color:#ffb4b4;padding:8px 12px;border-radius:9px;cursor:pointer}.empty{padding:45px;text-align:center;background:#0c1822;border-radius:18px;color:#9aaab4}</style></head><body><div class="wrap"><div class="top"><div><h1>التقييمات والتعليقات</h1><div class="meta">المستخدم: <span id="adminUser"></span> · عدد الرسائل: <span id="count">0</span></div><button class="enable" id="enableNotifications">تفعيل إشعارات المتصفح</button></div><div><a href="/">الموقع</a> · <button id="logout">تسجيل الخروج</button></div></div><div class="notice" id="notice" role="status"></div><div class="grid" id="list"></div></div><script>const emojis={1:'😞',2:'😕',3:'😐',4:'😊',5:'🤩'};const types={comment:'تعليق',suggestion:'اقتراح',opportunity:'فرصة عمل'};let knownCount=null;function notifyNewFeedback(amount){const text=`وصلت ${amount} رسالة جديدة.`;notice.textContent=text;notice.classList.add('show');document.title='تعليق جديد | لوحة التحكم';if('Notification'in window&&Notification.permission==='granted')new Notification('تعليق جديد',{body:text});}async function load(){const me=await fetch('/api/admin/me');if(!me.ok){location.href='/admin/login.html';return}const md=await me.json();adminUser.textContent=md.username;const r=await fetch('/api/admin/feedback');const d=await r.json();if(!d.success)return;if(knownCount!==null&&d.rows.length>knownCount)notifyNewFeedback(d.rows.length-knownCount);knownCount=d.rows.length;count.textContent=d.rows.length;if(!d.rows.length){list.innerHTML='<div class="empty">لا توجد رسائل حتى الآن.</div>';return}list.innerHTML=d.rows.map(x=>`<article class="item"><div class="meta"><span class="rating">${emojis[x.rating]||'🙂'}</span><span class="pill">${types[x.type]||x.type}</span><span>${esc(x.name||'زائر')}</span>${x.email?`<span>${esc(x.email)}</span>`:''}<span>${new Date(x.created_at).toLocaleString('ar')}</span></div><div class="message">${esc(x.message)}</div><button class="delete" onclick="removeItem(${x.id})">حذف</button></article>`).join('')}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function removeItem(id){if(!confirm('هل تريد حذف هذه الرسالة؟'))return;await fetch('/api/admin/feedback/'+id,{method:'DELETE'});load()}enableNotifications.onclick=async()=>{if('Notification'in window)await Notification.requestPermission()};logout.onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin/login.html'};load();setInterval(load,15000);</script></body></html>
